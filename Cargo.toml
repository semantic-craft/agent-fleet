[workspace]
resolver = "2"
members = [
    "crates/fleet-proto",
    "crates/fleet-hub",
    "crates/fleet-daemon",
    "crates/fleet-workbench-server",
    "crates/fleet-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fleet-proto = { path = "crates/fleet-proto" }
fleet-daemon = { path = "crates/fleet-daemon" }
